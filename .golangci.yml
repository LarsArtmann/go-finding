version: "2"
run:
  timeout: 5m
  go: 1.26.0
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
output:
  formats: {}
linters:
  disable:
    - exhaustruct
    - ireturn
    - noinlineerr
    - nlreturn
    - paralleltest
    - testpackage
    - varnamelen
    - wsl_v5
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr

    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign

  settings:
    cyclop:
      max-complexity: 25
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/larsartmann/go-finding
          deny:
            - pkg: io/ioutil
              desc: "deprecated since Go 1.16, use io and os"
        test:
          list-mode: lax
          files:
            - $test
          allow:
            - $gostd
            - github.com/larsartmann/go-finding
    forbidigo:
      exclude:
        - cmd/
        - examples/
    funlen:
      lines: 120
      statements: 80
    gocognit:
      min-complexity: 35
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 25
    godot:
      require-expecting-newline: false
    gosec:
      excludes:
        - G102
        - G104
        - G301
        - G304
        - G306
        - G307
        - G404
        - G401
        - G505
    mnd:
      ignored-functions:
        - fmt.Errorf
        - fmt.Fprintf
        - fmt.Sprintf
        - time.ParseDuration
        - os.WriteFile
        - os.MkdirAll
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "10"
    nestif:
      min-complexity: 6
    revive:
      rules:
        - name: unused-parameter
          severity: warning
          disabled: false
        - name: unreachable-code
          severity: warning
        - name: context-as-argument
          severity: warning
        - name: error-return
          severity: warning
        - name: error-strings
          severity: warning
        - name: error-naming
          severity: warning
        - name: exported
          severity: warning
        - name: increment-decrement
          severity: warning
        - name: var-naming
          severity: warning
        - name: package-comments
          severity: warning
        - name: range
          severity: warning
        - name: receiver-naming
          severity: warning
        - name: time-naming
          severity: warning
        - name: unexported-return
          severity: warning
        - name: indent-error-flow
          severity: warning
        - name: errorf
          severity: warning
        - name: unnecessary-stmt
          severity: warning
        - name: unused-receiver
          severity: warning
    wrapcheck:
      ignore-package-globs:
        - github.com/larsartmann/go-finding/*
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - err113
          - wrapcheck
          - unparam
      - path: cmd/
        linters:
          - gochecknoglobals
          - gochecknoinits
      - path: examples/
        linters:
          - gochecknoglobals
          - gochecknoinits
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
issues:
  max-issues-per-linter: 100
  max-same-issues: 5
