version: 2

run:
  timeout: 5m
  tests: false
  skip-dirs:
    - vendor

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - bodyclose
    - ineffassign
    - gosec
    - unconvert
    - unparam
    - testifylint
    - errorlint
    - forbidigo
    - gocognit
    - godot
    - gochecksumtype
  settings:
    gosec:
      excludes:
        - G102
        - G104
        - G301
        - G304
        - G306
        - G307

  godot:
    require-expecting-newline: false

issues:
  max-issues-per-linter: 50
  max-same-issues: 3

  exclude-use-default: false
  severity:
    default: warning