name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "pipeline/v*"
      - "analysis/v*"
      - "toolsdk/v*"
      - "cmd/go-finding/v*"

permissions:
  contents: write
  packages: write
  id-token: write

# Queue duplicate triggers instead of racing them: at v1.9.2 a manual dispatch
# raced the tag-push auto-trigger and the loser died on a 422 duplicate-asset
# error. One queueing group serializes every release run, so duplicate
# triggers are safe by construction.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Run tests
        run: go test -v -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build all
        run: go build -v ./...

  # CLI binary release — only for root-level (core) tags.
  # Library sub-modules (pipeline, analysis) need no binary; the tag itself
  # is what makes them resolvable via the Go module proxy.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          COSIGN_YES: true

  # Lightweight GitHub Release for library sub-module tags.
  # No binary artifact — just release notes derived from the tag.
  release-library-module:
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="${tag//\// }"
          gh release create "$tag" \
            --title "$name" \
            --notes "Library module release for \`$tag\`." \
            --prerelease
