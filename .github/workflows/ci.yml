name: CI

on:
  workflow_dispatch:
    inputs:
      modules:
        description: "Modules to lint (all | core | pipeline | analysis | cli, comma-separated)"
        required: false
        default: "all"
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"

permissions:
  contents: read

env:
  GOEXPERIMENT: jsonv2

jobs:
  test:
    strategy:
      matrix:
        go-version: ["1.26"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out

    timeout-minutes: 15
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Enforce per-package coverage thresholds
        run: bash scripts/coverage-check.sh coverage.out
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

    timeout-minutes: 15
  lint:
    strategy:
      matrix:
        module: [".", "pipeline", "analysis", "cmd/go-finding"]
    runs-on: ubuntu-latest
    name: lint (${{ matrix.module }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      # Module scoping for workflow_dispatch runs (inputs.modules): steps
      # skip when their module is not selected. Push/PR runs lint everything.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: >-
          ${{
            github.event_name != 'workflow_dispatch' ||
            inputs.modules == 'all' ||
            (matrix.module == '.' && (contains(inputs.modules, 'core') || contains(inputs.modules, '.'))) ||
            (matrix.module == 'pipeline' && contains(inputs.modules, 'pipeline')) ||
            (matrix.module == 'analysis' && contains(inputs.modules, 'analysis')) ||
            (matrix.module == 'cmd/go-finding' && contains(inputs.modules, 'cli'))
          }}
        with:
          version: v2.13.1
          args: --timeout=5m
          working-directory: ${{ matrix.module }}
      - name: Check formatting
        if: >-
          ${{
            github.event_name != 'workflow_dispatch' ||
            inputs.modules == 'all' ||
            (matrix.module == '.' && (contains(inputs.modules, 'core') || contains(inputs.modules, '.'))) ||
            (matrix.module == 'pipeline' && contains(inputs.modules, 'pipeline')) ||
            (matrix.module == 'analysis' && contains(inputs.modules, 'analysis')) ||
            (matrix.module == 'cmd/go-finding' && contains(inputs.modules, 'cli'))
          }}
        working-directory: ${{ matrix.module }}
        run: golangci-lint fmt --diff ./...

    timeout-minutes: 15
  preflight-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Release preflight self-test (injected drift + tag collision must FAIL)
        run: bash scripts/release-preflight-selftest.sh

    timeout-minutes: 20
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify version.go matches git tag
        run: bash scripts/version-check.sh

    timeout-minutes: 5
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

    timeout-minutes: 15
  module-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Build each module standalone (GOWORK=off)
        run: |
          for mod in . pipeline analysis cmd/go-finding; do
            echo "=== $mod ==="
            (cd "$mod" && GOWORK=off go build ./...)
          done
      - name: Test each module standalone (GOWORK=off)
        run: |
          for mod in . pipeline analysis cmd/go-finding; do
            echo "=== $mod ==="
            (cd "$mod" && GOWORK=off go test -count=1 ./...)
          done

    timeout-minutes: 15
  structural-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify replace directives
        run: bash scripts/replace-audit.sh
      - name: Verify version drift
        run: bash scripts/version-drift.sh
      - name: Verify test naming conventions
        run: bash scripts/test-naming.sh
      - name: Verify JSON determinism
        run: bash scripts/json-deterministic-check.sh

    timeout-minutes: 5
  go-work-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Verify go.work sync
        run: bash scripts/go-work-sync.sh

    timeout-minutes: 5
  docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check documentation freshness
        run: bash scripts/docs-freshness.sh

    timeout-minutes: 5
  docs-api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check documented API identifiers exist in code
        run: bash scripts/docs-api-check.sh

    timeout-minutes: 5
  arch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@latest
      - name: Check module boundaries
        run: go-arch-lint check

    timeout-minutes: 5
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Stress test (-count=20)
        run: go test -race -count=20 ./...

    timeout-minutes: 15
  dupl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Install art-dupl
        run: go install github.com/LarsArtmann/art-dupl/cmd/art-dupl@latest
      - name: Check duplication (threshold 50)
        run: art-dupl . -t 50

    timeout-minutes: 15
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Run benchmarks (count=10 for statistical significance)
        run: |
          go test -bench=. -benchmem -count=10 -run='^$' ./... 2>&1 | tee bench-current.txt
          cd pipeline
          go test -bench=. -benchmem -count=10 -run='^$' . >> ../bench-current.txt
      - name: Check for regressions vs baseline (fail if >25% slower)
        # benchstat resolves via the pinned Go tool directive in go.mod
        # (tool golang.org/x/perf/cmd/benchstat) — reproducible, no @latest.
        run: bash scripts/bench-check.sh benchmarks/baseline.txt bench-current.txt 25
      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: benchmark-results
          path: |
            bench-current.txt
            benchmarks/baseline.txt
    timeout-minutes: 15
  changelog-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify CHANGELOG.md was updated
        run: |
          if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^CHANGELOG.md$"; then
            echo "::warning::CHANGELOG.md was not updated. Please add an entry under [Unreleased]."
          fi

    timeout-minutes: 5
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for broken internal markdown links
        run: |
          # Check relative links in markdown files resolve to existing files.
          # Code is stripped first (fenced blocks, indented blocks, inline
          # spans): generic signatures like `NewIntervalIndex[T](intervals)`
          # otherwise parse as links. \x60 = backtick (avoids shellcheck SC2016).
          rc=0
          while IFS= read -r file; do
            while IFS= read -r link; do
              # Skip URLs and anchors
              [[ "$link" =~ ^https?:// ]] && continue
              [[ "$link" =~ ^# ]] && continue
              # Strip anchor from end
              target="${link%%#*}"
              [ -z "$target" ] && continue
              # Skip targets with spaces (code remnants)
              [[ "$target" == *" "* ]] && continue
              # Resolve relative to the markdown file's directory
              dir=$(dirname "$file")
              fullpath="$dir/$target"
              if [ ! -e "$fullpath" ]; then
                echo "::error file=$file::Broken link: $link (resolved: $fullpath)"
                rc=1
              fi
            done < <(awk '/^```/{f=!f;next} f{next} /^ {4}/{next} {print}' "$file" \
              | sed 's/\x60[^\x60]*\x60//g' \
              | grep -oP '\[.*?\]\(\K[^)]+' 2>/dev/null)
          done < <(find . -name "*.md" -not -path "./vendor/*")
          exit $rc

      # pkg.go.dev excluded TEMPORARILY: the page 404s until pkg.go.dev finishes
      # indexing a freshly-public module (can lag hours). Remove the --exclude
      # once https://pkg.go.dev/github.com/larsartmann/go-finding is live.
      - name: Check all markdown links incl. http(s) and archived docs (lychee)
        uses: lycheeverse/lychee-action@649b0e4890508ea3e11ea6b3ee35ce899a25afd5 # v1
        with:
          args: >-
            --no-progress
            --max-retries 2
            --timeout 15
            --exclude-loopback
            --exclude 'pkg\.go\.dev'
            './**/*.md'
          fail: true

    timeout-minutes: 10
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
