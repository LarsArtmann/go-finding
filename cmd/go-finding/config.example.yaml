# go-finding configuration
# See go-finding -h for available options.

maxIterations: 5
parallelDetectors: true
verifyAfterFix: false
timeout: "10m"

detectors:
  - name: govet
    args: {}
  - name: staticcheck
    args: {}

# Filter out findings from auto-generated Go source files.
# Supported types: all, sqlc, templ, go-enum, protobuf, oapi-codegen,
# deepcopy-gen, wire, moq, mockgen, stringer, generic
# filterGenerated: true
# filterGenTypes: "all"
# generatedExclude:
#   - "**/vendor/**"
# generatedInclude:
#   - "pkg/**"
